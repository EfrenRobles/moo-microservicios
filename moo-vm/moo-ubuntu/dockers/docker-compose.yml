########################################################################################################################
# Usage:
#
# docker compose up -d
# docker compose restart
# docker compose stop
#
# Optional: use the interactive menu or Makefile targets (make up, make stop)
########################################################################################################################

services:

  ######################################################################################################################
  # PostgreSQL 18
  ######################################################################################################################
  postgres18:
    image: postgres:18
    container_name: postgres18
    environment:
      POSTGRES_DB: moo
      POSTGRES_USER: moo
      POSTGRES_PASSWORD: moo
    ports:
      - "5432:5432"
    volumes:
      - /mnt/moo-shared/docker-state/postgres:/var/lib/postgresql
    networks:
      - moo-network-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moo -d moo"]
      interval: 10s
      timeout: 5s
      retries: 5

  ######################################################################################################################
  # LocalStack (SQS, SNS)
  ######################################################################################################################
  localstack:
    image: localstack/localstack:3.0
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs,sns
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/moo-ubuntu/dockers/localstack:/localstack:ro
    networks:
      - moo-network-dev

  ######################################################################################################################
  # RabbitMQ 4.0 - Enterprise Message Broker (AWS SQS/SNS Compatible via Binder)
  ######################################################################################################################
  # rabbitmq:
  #   image: rabbitmq:4.0-management-alpine
  #   container_name: rabbitmq-moo
  #   ports:
  #     - "5672:5672"   # Protocolo AMQP
  #     - "15672:15672" # Management UI
  #   environment:
  #     RABBITMQ_DEFAULT_USER: moo
  #     RABBITMQ_DEFAULT_PASS: moo
  #   volumes:
  #     - /mnt/moo-shared/docker-state/rabbitmq:/var/lib/rabbitmq      
  #   networks:
  #     - moo-network-dev

  ######################################################################################################################
  # OpenLDAP AD-like Directory
  ######################################################################################################################
  openldap:
    image: openldap-from-source
    build:
      context: ./openldap
    container_name: openldap-adlike
    ports:
      - "389:389"
    environment:
      LDAP_LOG_LEVEL: "256"        # Opcional: Habilita mas verbose para el logging
    volumes:
      - /mnt/moo-data/docker-state/ldap/data:/usr/local/var/openldap-data
      - /mnt/moo-data/docker-state/ldap/config:/etc/openldap/slapd.d
    networks:
      - moo-network-dev

  ######################################################################################################################
  # Dozzle (Container Log Viewer)
  ######################################################################################################################
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    ports:
      - "9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - moo-network-dev


########################################################################################################################
# Networks
########################################################################################################################
networks:
  moo-network-dev:
    driver: bridge
    name: moo-network-dev
