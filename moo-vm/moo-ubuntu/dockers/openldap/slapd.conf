# ------------------------------------------------------------
# OpenLDAP AD-like Configuration
# ------------------------------------------------------------

# Core schemas
include         /usr/local/etc/openldap/schema/core.schema
include         /usr/local/etc/openldap/schema/cosine.schema
include         /usr/local/etc/openldap/schema/msad.schema

# Runtime files
pidfile         /usr/local/var/run/slapd.pid
argsfile        /usr/local/var/run/slapd.args

# Modules
modulepath      /usr/local/libexec/openldap
moduleload      back_mdb.so
moduleload      memberof.so
moduleload      refint.so

# ------------------------------------------------------------
# Database configuration
# ------------------------------------------------------------
database        mdb
suffix          "dc=example,dc=com"
rootdn          "cn=admin,dc=example,dc=com"
rootpw          admin
directory       /usr/local/var/openldap-data

# Indexes
index objectClass eq
index uid,cn,mail eq

# ------------------------------------------------------------
# memberOf overlay configuration
# ------------------------------------------------------------
overlay                 memberof

# ------------------------------------------------------------
# Referential integrity overlay
# Ensures memberOf is updated when group membership changes
# ------------------------------------------------------------
overlay                 refint
refint_attributes       memberof member manager owner
